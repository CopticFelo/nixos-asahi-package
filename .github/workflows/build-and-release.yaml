name: Build package and release

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Build metapackage
        run: |
          nix profile install nixpkgs#nix-fast-build
          nix build .#packages.aarch64-linux.installerPackage.ext4
          # nix-fast-build \
          #   --flake .#packages.aarch64-linux.installerPackage.ext4 \
          #   --eval-max-memory-size 4096 \
          #   --skip-cached \
          #   --no-nom \
          #   --out-link ./result-aarch64-linux

      - name: Verify Build Artifacts
        run: |
          ls -la result-aarch64-linux/

      - name: Archive and upload nixos asahi images and installer data
        uses: actions/upload-artifact@v4
        with:
          name: nixos-package-artificats
          path: |
            result-aarch64-linux/installer_data-*.json
            result-aarch64-linux/nixos-asahi-*.zip

